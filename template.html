<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issac Trotts — Resume</title>
<meta name="description" content="Issac Trotts: senior software engineer. Go, Elixir. Ex-Google, ex-YouTube.">
<style>
  :root {
    --bg: #fbfaf7;
    --paper: #ffffff;
    --ink: #1c1d1f;
    --muted: #5d6068;
    --faint: #8a8d94;
    --rule: #e4e1da;
    --accent: #1f5f8b;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141517;
      --paper: #1b1c1f;
      --ink: #e8e6e1;
      --muted: #a4a7ad;
      --faint: #7c7f86;
      --rule: #303237;
      --accent: #7db4dc;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141517; --paper: #1b1c1f; --ink: #e8e6e1; --muted: #a4a7ad;
    --faint: #7c7f86; --rule: #303237; --accent: #7db4dc; --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 "Charter", "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
    font-kerning: normal;
  }
  .sans, h2, h3, .meta, .contact, .tags {
    font-family: ui-sans-serif, "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .page {
    max-width: 820px;
    margin: 40px auto;
    padding: 56px 64px;
    background: var(--paper);
    box-shadow: var(--shadow);
    border-radius: 6px;
  }

  header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end;
           padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
  h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }
  .role { margin-top: 6px; color: var(--muted); font-size: 15px; }
  .contact { text-align: right; font-size: 13px; line-height: 1.6; color: var(--muted); white-space: nowrap; }

  section { margin-top: 26px; }
  h2 {
    margin: 0 0 10px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent);
  }
  .summary { margin: 0; font-size: 15.5px; }

  .skills { display: grid; grid-template-columns: 120px 1fr; gap: 4px 16px; font-size: 14px; margin: 0; }
  .skills dt { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; padding-top: 2px; }
  .skills dd { margin: 0; }

  .job { margin-top: 16px; break-inside: avoid; }
  .job:first-of-type { margin-top: 0; }
  .job-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  h3 { margin: 0; font-size: 15.5px; font-weight: 700; }
  h3 .title { font-weight: 400; color: var(--muted); }
  .meta { font-size: 12.5px; color: var(--faint); white-space: nowrap; }
  .sub { margin: 8px 0 0; font-size: 13px; font-weight: 600; color: var(--muted);
         font-family: ui-sans-serif, system-ui, sans-serif; }
  ul { margin: 6px 0 0; padding-left: 18px; }
  li { margin: 3px 0; }
  li::marker { color: var(--faint); }

  .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; }
  .project h3 { font-size: 14.5px; }
  .project p { margin: 2px 0 0; font-size: 14px; }
  .tags { font-size: 11.5px; color: var(--faint); margin-top: 2px; }

  .compact li { margin: 5px 0; }
  .compact .meta { margin-left: 6px; }

  .edu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 28px; font-size: 14px; }
  .edu strong { display: block; }


  @media (max-width: 700px) {
    body { font-size: 15px; }
    .page { margin: 0; padding: 28px 16px 40px; border-radius: 0; box-shadow: none; }
    header { flex-direction: column; align-items: flex-start; }
    .contact { text-align: left; white-space: normal; }
    h1 { font-size: 28px; }
    .job-head { flex-direction: column; gap: 0; }
    .skills { grid-template-columns: 1fr; gap: 0; }
    .skills dd { margin-bottom: 8px; }
    .projects, .edu { grid-template-columns: 1fr; }
  }

  @page { size: letter; margin: 0.45in 0; }
  @media print {
    :root, :root[data-theme="dark"] {
      --bg: #fff; --paper: #fff; --ink: #1c1d1f; --muted: #5d6068; --faint: #8a8d94;
      --rule: #e4e1da; --accent: #1f5f8b; --shadow: none;
    }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page { zoom: 0.86; margin: 0; padding: 0 74px; max-width: none; border-radius: 0; box-shadow: none; }
    h2, .job-head, .sub { break-after: avoid; }
    .project, .compact li { break-inside: avoid; }
  }
</style>
{{head_extra}}</head>
<body>

<main class="page">
{{body}}
</main>

{{body_extra}}</body>
</html>
